<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1813" />
      <stop offset="100%" stop-color="#0A0907" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8AD" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark obsidian background with golden border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <g filter="url(#shadow)">
    <!-- Roman Laurel Wreath - Left Branch -->
    <g fill="url(#goldGrad)">
      <path d="M 160,370 C 130,340 120,290 125,240 C 130,190 155,145 195,115 C 185,135 180,165 190,190 C 200,215 210,230 205,255 C 200,280 185,310 160,370 Z" opacity="0.25" />
      
      <path d="M 145,360 C 115,345 105,320 125,305 C 145,290 165,315 155,340 Z" />
      <path d="M 125,315 C 95,295 90,265 112,255 C 135,245 150,270 138,295 Z" />
      <path d="M 115,260 C 85,235 85,205 108,198 C 130,190 142,218 128,242 Z" />
      <path d="M 118,202 C 92,172 98,142 120,140 C 142,138 148,168 132,190 Z" />
      <path d="M 132,148 C 110,118 120,90 142,92 C 165,94 165,124 148,142 Z" />
      <path d="M 160,105 C 142,75 160,52 180,60 C 200,68 192,98 175,105 Z" />
      <path d="M 195,72 C 185,42 208,25 224,38 C 240,50 225,78 208,78 Z" />
    </g>

    <!-- Roman Laurel Wreath - Right Branch -->
    <g fill="url(#goldGrad)" transform="translate(512,0) scale(-1,1)">
      <path d="M 145,360 C 115,345 105,320 125,305 C 145,290 165,315 155,340 Z" />
      <path d="M 125,315 C 95,295 90,265 112,255 C 135,245 150,270 138,295 Z" />
      <path d="M 115,260 C 85,235 85,205 108,198 C 130,190 142,218 128,242 Z" />
      <path d="M 118,202 C 92,172 98,142 120,140 C 142,138 148,168 132,190 Z" />
      <path d="M 132,148 C 110,118 120,90 142,92 C 165,94 165,124 148,142 Z" />
      <path d="M 160,105 C 142,75 160,52 180,60 C 200,68 192,98 175,105 Z" />
      <path d="M 195,72 C 185,42 208,25 224,38 C 240,50 225,78 208,78 Z" />
    </g>

    <!-- Bottom Ribbon Tie -->
    <path d="M 236,375 C 248,365 264,365 276,375 C 286,385 270,410 256,400 C 242,410 226,385 236,375 Z" fill="url(#goldBright)" />

    <!-- Center Roman Monogram "A" (Aurelius) -->
    <g fill="url(#goldBright)">
      <path d="M 205,335 L 246,165 L 266,165 L 307,335 L 285,335 L 273,285 L 239,285 L 227,335 Z M 244,265 L 268,265 L 256,210 Z" />
      <polygon points="256,125 262,140 277,146 262,152 256,167 250,152 235,146 250,140" fill="url(#goldGrad)" />
    </g>

    <!-- Roman Numeral / Stoic Accent below -->
    <text x="256" y="445" font-family="'Times New Roman', serif" font-weight="bold" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">AURELIUS</text>
  </g>
</svg>